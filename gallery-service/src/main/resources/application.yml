server:
  address: 127.0.0.1
  port: 18766

spring:
  application:
    name: gallery-service
  datasource:
    url: ${GALLERY_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/specpulse}
    username: ${GALLERY_DB_USER:postgres}
    password: ${GALLERY_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc.time_zone: UTC

gallery:
  public-url: ${GALLERY_PUBLIC_URL:http://127.0.0.1:18766}
  frontend-url: ${GALLERY_FRONTEND_URL:http://127.0.0.1:43721}
  jwt-secret: ${GALLERY_JWT_SECRET:}
  admin-emails: ${GALLERY_ADMIN_EMAILS:}
  google:
    client-id: ${GALLERY_GOOGLE_CLIENT_ID:}
    client-secret: ${GALLERY_GOOGLE_CLIENT_SECRET:}

logging:
  level:
    org.hibernate.SQL: warn
